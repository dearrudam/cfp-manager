# PostgreSQL datasource.
# In dev/test, Quarkus Dev Services auto-starts a PostgreSQL container,
# so no JDBC URL is needed there. For prod, configure via env vars or edit below.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/c4p_manager}
%prod.quarkus.datasource.username=${DATABASE_USER:postgres}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:postgres}

# Flyway manages the schema: SQL migrations in src/main/resources/db/migration
# run automatically on startup in every profile (dev, test and prod).
quarkus.flyway.migrate-at-start=true

# Flyway owns the schema; Hibernate only validates entity mappings against it at startup.
quarkus.hibernate-orm.schema-management.strategy=validate
